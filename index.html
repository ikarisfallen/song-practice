<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1b2730" />
<title>Song Practice</title>
<link rel="stylesheet" href="style.css?v=60" />
</head>
<body>
<div id="app">
  <aside id="sidebar" hidden></aside>
  <div id="songListPanel" class="song-list-panel">
    <div class="song-filter-row">
      <div class="song-filter-wrap">
        <input type="text" id="songFilter" class="song-filter" placeholder="Filter..." autocomplete="off" />
        <button type="button" id="songFilterClear" class="song-filter-clear" aria-label="Clear filter" hidden>✕</button>
      </div>
      <button type="button" id="songPickerClose" class="song-picker-close" aria-label="Close" hidden>✕</button>
    </div>
    <ul id="songList" class="song-list" role="listbox" aria-label="Songs"></ul>
  </div>
  <div id="mainArea" class="main-area">
  <header>
    <div class="top-row">
      <button id="playBtn" class="top-btn play" aria-label="Play"><span class="play-glyph">▶</span><span class="loop-indicator" aria-hidden="true">↻</span></button>
      <button id="rewindBtn" class="top-btn" aria-label="Rewind to start">⏮</button>
      <button id="loopInBtn" class="top-btn" aria-label="Loop in" disabled>
        <svg viewBox="0 0 16 22" aria-hidden="true"><path d="M 13 2 L 3 2 L 3 20 L 13 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
      </button>
      <button id="loopOutBtn" class="top-btn" aria-label="Loop out" disabled>
        <svg viewBox="0 0 16 22" aria-hidden="true"><path d="M 3 2 L 13 2 L 13 20 L 3 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
      </button>
      <button id="clearLoopBtn" class="top-btn" aria-label="Clear loop" disabled>✕</button>
      <button type="button" id="songPickerBtn" class="song-picker" aria-label="Song library">
        <span id="songName" class="song-label" aria-live="polite"></span>
      </button>
      <button id="fbToggle" class="top-btn" aria-label="Toggle note info" aria-expanded="false">♪</button>
      <button id="optionsToggle" class="top-btn" aria-label="Toggle options" aria-expanded="false">⚙</button>
    </div>
    <div id="optionsPanel" class="options-panel" hidden>
      <div class="drum-row">
        <span class="drum-label">Exercise</span>
        <select id="exerciseSelect" class="exercise-select">
          <option value="head">Head</option>
          <option value="scale" selected>Scale Notes</option>
          <option value="triads">Triads</option>
          <option value="chord">Chord Tones</option>
          <option value="broken3">Broken 3rds</option>
          <option value="cantus">Cantus Firmus</option>
          <option value="1235">1235</option>
          <option value="3579">3579</option>
        </select>
      </div>
      <div class="drum-row">
        <span class="drum-label">Key</span>
        <div class="seg key-seg" id="keySeg" role="tablist">
          <button type="button" data-key="A">A</button>
          <button type="button" data-key="Bb">B♭</button>
          <button type="button" data-key="B">B</button>
          <button type="button" data-key="C">C</button>
          <button type="button" data-key="C#">C♯</button>
          <button type="button" data-key="D">D</button>
          <button type="button" data-key="Eb">E♭</button>
          <button type="button" data-key="E">E</button>
          <button type="button" data-key="F">F</button>
          <button type="button" data-key="F#">F♯</button>
          <button type="button" data-key="G">G</button>
          <button type="button" data-key="G#">G♯</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Tempo</span>
        <div class="seg tempo-seg" id="tempoSeg" role="tablist">
          <button type="button" data-bpm="80">Ballad (80)</button>
          <button type="button" data-bpm="120" class="active">Medium (120)</button>
          <button type="button" data-bpm="180">Up (180)</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Count-in</span>
        <div class="seg" id="countInSeg" role="tablist">
          <button type="button" data-count="0">Off</button>
          <button type="button" data-count="1" class="active">1 bar</button>
          <button type="button" data-count="2">2 bars</button>
        </div>
        <label class="wake-label embellish-label">
          <input type="checkbox" id="embellishToggle" class="switch-input" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Embellish Piano</span>
        </label>
      </div>
      <div class="drum-row">
        <span class="drum-label">Drums</span>
        <div class="seg" id="drumSeg" role="tablist">
          <button type="button" data-mode="ride" class="active">Real</button>
          <button type="button" data-mode="hat">2 & 4</button>
          <button type="button" data-mode="click">Click</button>
        </div>
        <input type="range" id="drumVol" class="drum-vol" min="0" max="100" value="75" aria-label="Drum volume" />
      </div>
      <div class="drum-row">
        <span class="drum-label">Bars / Line</span>
        <div class="seg" id="mplSeg" role="tablist">
          <button type="button" data-mpl="1">1</button>
          <button type="button" data-mpl="2" class="active">2</button>
          <button type="button" data-mpl="4">4</button>
          <button type="button" data-mpl="6">6</button>
          <button type="button" data-mpl="8">8</button>
        </div>
        <span class="drum-label">Size</span>
        <div class="seg" id="sizeSeg" role="tablist">
          <button type="button" data-size="240">S</button>
          <button type="button" data-size="180" class="active">M</button>
          <button type="button" data-size="120">L</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Repeats</span>
        <div class="seg" id="repeatSeg" role="tablist">
          <button type="button" data-r="1" class="active">1</button>
          <button type="button" data-r="2">2</button>
          <button type="button" data-r="3">3</button>
          <button type="button" data-r="4">4</button>
        </div>
      </div>
      <div class="drum-row">
        <label class="wake-label">
          <input type="checkbox" id="wakeLock" class="switch-input" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Stay awake</span>
        </label>
        <label class="wake-label play-score-label">
          <input type="checkbox" id="playScoreToggle" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
          <span>Play Score</span>
        </label>
        <label class="wake-label fingering-label">
          <input type="checkbox" id="fingeringToggle" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
          <span>Fingering</span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div id="chart" class="chart"></div>
  </main>
  <div class="fingerboard-section">
    <div id="fingerboardPanel" class="fingerboard-panel" hidden>
      <div class="fb-left">
        <div class="fb-chord-line">
          <span class="fb-chord-name" id="fbChordName"></span>
          <span class="fb-chord-notes" id="fbChordNotes"></span>
        </div>
        <div class="fb-notes-measure" id="fbNotesMeasure"></div>
        <div class="fb-scale-name" id="fbScale"></div>
        <div class="fb-chord-nav" id="fbChordNav" hidden>
          <button type="button" id="fbChordPrev" class="fb-chord-nav-btn">Previous</button>
          <button type="button" id="fbChordNext" class="fb-chord-nav-btn">Next</button>
        </div>
      </div>
      <div class="fb-grid" id="fbGrid"></div>
    </div>
  </div>

  <footer>
    <div class="status" id="status">Ready</div>
  </footer>
  </div><!-- /#mainArea -->
</div>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="app.js?v=224"></script>
</body>
</html>
