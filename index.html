<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1b2730" />
<title>Song Practice</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css?v=124" />
</head>
<body>
<div id="app">
  <aside id="sidebar" hidden></aside>
  <div id="songListPanel" class="song-list-panel">
    <div class="song-filter-row">
      <div class="song-filter-wrap">
        <input type="text" id="songFilter" class="song-filter" placeholder="Filter..." autocomplete="off" />
        <button type="button" id="songFilterClear" class="song-filter-clear" aria-label="Clear filter" hidden>✕</button>
      </div>
      <button type="button" id="songPickerClose" class="song-picker-close" aria-label="Close" hidden>✕</button>
    </div>
    <ul id="songList" class="song-list" role="listbox" aria-label="Songs"></ul>
  </div>
  <div id="mainArea" class="main-area">
  <header>
    <div class="top-row">
      <button id="playBtn" class="top-btn play" aria-label="Play"><span class="play-glyph">▶</span><span class="loop-indicator" aria-hidden="true">↻</span></button>
      <button id="rewindBtn" class="top-btn" aria-label="Rewind to start">⏮</button>
      <button id="loopInBtn" class="top-btn" aria-label="Loop in" disabled>
        <svg viewBox="0 0 16 22" aria-hidden="true"><path d="M 13 2 L 3 2 L 3 20 L 13 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
      </button>
      <button id="loopOutBtn" class="top-btn" aria-label="Loop out" disabled>
        <svg viewBox="0 0 16 22" aria-hidden="true"><path d="M 3 2 L 13 2 L 13 20 L 3 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
      </button>
      <button id="clearLoopBtn" class="top-btn" aria-label="Clear loop" disabled>✕</button>
      <button type="button" id="songPickerBtn" class="top-btn" aria-label="Song library">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6 L10 6 L12 8 L21 8 L21 19 L3 19 Z"
                stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="fbToggle" class="top-btn" aria-label="Toggle note info" aria-expanded="false">♪</button>
      <button id="instrumentsToggle" class="top-btn" aria-label="Toggle instruments" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="12"
                stroke="currentColor" stroke-width="1.8" fill="none"/>
          <line x1="8"  y1="7" x2="8"  y2="19" stroke="currentColor" stroke-width="1.4"/>
          <line x1="12" y1="7" x2="12" y2="19" stroke="currentColor" stroke-width="1.4"/>
          <line x1="16" y1="7" x2="16" y2="19" stroke="currentColor" stroke-width="1.4"/>
          <rect x="6.5"  y="7" width="3" height="7" fill="currentColor"/>
          <rect x="10.5" y="7" width="3" height="7" fill="currentColor"/>
          <rect x="14.5" y="7" width="3" height="7" fill="currentColor"/>
        </svg>
      </button>
      <button id="optionsToggle" class="top-btn" aria-label="Toggle options" aria-expanded="false">⚙</button>
      <button id="printScoreBtn" class="top-btn print-btn" type="button" aria-label="Print Worksheet" hidden>
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <path fill="currentColor" d="M732 120c0-4.4-3.6-8-8-8H300c-4.4 0-8 3.6-8 8v148h440V120zm120 212H172c-44.2 0-80 35.8-80 80v328c0 17.7 14.3 32 32 32h168v132c0 4.4 3.6 8 8 8h424c4.4 0 8-3.6 8-8V772h168c17.7 0 32-14.3 32-32V412c0-44.2-35.8-80-80-80zM664 844H360V568h304v276zm164-360c0 4.4-3.6 8-8 8h-40c-4.4 0-8-3.6-8-8v-40c0-4.4 3.6-8 8-8h40c4.4 0 8 3.6 8 8v40z"/>
        </svg>
      </button>
      <label id="editModeLabel" class="top-edit-label" hidden>
        <input type="checkbox" id="editModeToggle" class="switch-input" />
        <span class="switch" aria-hidden="true"></span>
        <span class="top-edit-text">Edit Fingering</span>
      </label>
      <button id="editKebabBtn" class="top-btn edit-kebab" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false" hidden>⋮</button>
      <div id="editKebabMenu" class="edit-kebab-menu" role="menu" hidden>
        <button id="copyFingeringsBtn" type="button" role="menuitem">Copy Fingerings</button>
        <button id="pasteFingeringsBtn" type="button" role="menuitem" disabled>Paste Fingerings</button>
        <hr class="edit-kebab-sep" role="separator" />
        <button class="em-position-btn" data-position="half" type="button" role="menuitem">Apply 1/2 Position</button>
        <button class="em-position-btn" data-position="first" type="button" role="menuitem">Apply 1st Position</button>
        <button class="em-position-btn" data-position="upper1st" type="button" role="menuitem">Apply +1st Position</button>
        <button class="em-position-btn" data-position="second" type="button" role="menuitem">Apply 2nd Position</button>
        <button class="em-position-btn" data-position="third" type="button" role="menuitem">Apply 3rd Position</button>
        <button class="em-position-btn" data-position="upper3rd" type="button" role="menuitem">Apply +3rd Position</button>
        <button class="em-position-btn" data-position="fourth" type="button" role="menuitem">Apply 4th Position</button>
        <button class="em-position-btn" data-position="upper4th" type="button" role="menuitem">Apply +4th Position</button>
        <button class="em-position-btn" data-position="fifth" type="button" role="menuitem">Apply 5th Position</button>
        <hr class="edit-kebab-sep" role="separator" />
        <button id="deleteAllFingeringsBtn" type="button" role="menuitem" class="edit-kebab-danger">Delete All Fingerings</button>
      </div>
    </div>
    <div id="optionsPanel" class="options-panel" hidden>
      <div class="drum-row">
        <div class="seg mode-seg" id="modeSeg" role="tablist">
          <button type="button" data-mode="head" class="active">Score</button>
          <button type="button" data-mode="lick" hidden>Lick</button>
          <button type="button" data-mode="exercise">Exercise</button>
          <button type="button" data-mode="drone">Drone</button>
        </div>
        <div class="seg lick-proj-seg" id="lickProjSeg" role="tablist" hidden>
          <button type="button" data-proj="functional" class="active" hidden>Functional</button>
          <button type="button" data-proj="3579" hidden>3579</button>
          <button type="button" data-proj="scale" hidden>Scale</button>
        </div>
        <select id="exerciseSelect" class="exercise-select">
          <option value="chordOne">Chord Tones - One</option>
          <option value="chordTwo" selected>Chord Tones - Two</option>
          <option value="chordFour">Chord Tones - Four</option>
          <option value="scale" hidden>Scale Notes</option>
          <option value="scaleChromatic" hidden>Scale Chromatic</option>
          <option value="threeSeven" hidden>Three Seven</option>
          <option value="landmarks" hidden>Landmarks</option>
          <option value="landmarks13" hidden>Landmarks-1-3</option>
          <option value="triads" hidden>Triads</option>
          <option value="broken3" hidden>Broken 3rds</option>
          <option value="cantus" hidden>Cantus Firmus</option>
          <option value="targetTriad" hidden>Target Triad</option>
          <option value="descending" hidden>Descending</option>
          <option value="range3579" hidden>3579 Range</option>
          <option value="range3579Half" hidden>3579 Range Half</option>
          <option value="enclosures" hidden>Enclosures</option>
          <option value="longEnclosures" hidden>Long Enclosures</option>
          <option value="1235" hidden>1235</option>
          <option value="1235Eighth" hidden>1235 Eighth</option>
          <option value="3579" hidden>3579</option>
          <option value="3579Eighth" hidden>3579 Eighth</option>
          <option value="1357" hidden>1357</option>
          <option value="walkTriad" hidden>Walk Triad</option>
          <option value="mixedTriads" hidden>Mixed Triads</option>
          <option value="walkBass" hidden>Walking Bassline</option>
          <option value="walkBassPC" hidden>Walking Bassline (Chambers)</option>
        </select>
        <button type="button" id="gameToggle" class="game-toggle-btn" aria-label="Game mode" aria-pressed="false" title="Game mode (Exercise mode only)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="7" width="20" height="12" rx="3" ry="3"
                  stroke="currentColor" stroke-width="1.8" fill="none"/>
            <line x1="7"  y1="11" x2="7"  y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="5"  y1="13" x2="9"  y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="15.5" cy="11.5" r="1.3" fill="currentColor"/>
            <circle cx="18"   cy="14"   r="1.3" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="drum-row">
        <span class="drum-label">Tempo</span>
        <div class="seg tempo-seg" id="tempoSeg" role="tablist">
          <button type="button" data-bpm="80">80</button>
          <button type="button" data-bpm="100">100</button>
          <button type="button" data-bpm="120" class="active">120</button>
          <button type="button" data-bpm="180">180</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Key</span>
        <div class="seg key-seg" id="keySeg" role="tablist">
          <button type="button" data-key="A">A</button>
          <button type="button" data-key="Bb">B♭</button>
          <button type="button" data-key="B">B</button>
          <button type="button" data-key="C">C</button>
          <button type="button" data-key="C#">C♯</button>
          <button type="button" data-key="D">D</button>
          <button type="button" data-key="Eb">E♭</button>
          <button type="button" data-key="E">E</button>
          <button type="button" data-key="F">F</button>
          <button type="button" data-key="F#">F♯</button>
          <button type="button" data-key="G">G</button>
          <button type="button" data-key="G#">G♯</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Bars / Line</span>
        <div class="seg" id="mplSeg" role="tablist">
          <button type="button" data-mpl="1">1</button>
          <button type="button" data-mpl="2">2</button>
          <button type="button" data-mpl="3">3</button>
          <button type="button" data-mpl="4" class="active">4</button>
          <button type="button" data-mpl="6">6</button>
          <button type="button" data-mpl="8" class="desktop-only-mpl">8</button>
        </div>
        <span class="drum-label">Size</span>
        <div class="seg" id="sizeSeg" role="tablist">
          <button type="button" data-size="180">S</button>
          <button type="button" data-size="120" class="active">M</button>
          <button type="button" data-size="80">L</button>
        </div>
      </div>
      <div class="drum-row">
        <span class="drum-label">Repeats</span>
        <div class="seg" id="repeatSeg" role="tablist">
          <button type="button" data-r="1" class="active">1</button>
          <button type="button" data-r="2">2</button>
          <button type="button" data-r="3">3</button>
          <button type="button" data-r="4">4</button>
        </div>
        <label class="wake-label">
          <input type="checkbox" id="wakeLock" class="switch-input" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Stay on</span>
        </label>
        <button id="overlaysBtn" class="overlays-btn" type="button" aria-label="Overlays" aria-haspopup="menu" aria-expanded="false">
          <span class="overlays-btn-text">Overlays</span>
          <span class="overlays-btn-chevron" aria-hidden="true">▾</span>
        </button>
        <div id="overlaysMenu" class="overlays-menu" role="menu" hidden>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayNotesToggle" />
            <span>Note Name</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayDegreeNamesToggle" />
            <span>Degree Name</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayChordToneNamesToggle" />
            <span>Chord Tone Names</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayScaleDegreesToggle" />
            <span>Scale Degrees</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayCurrentNoteToggle" />
            <span>Current Note</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayBeatsToggle" />
            <span>Beats</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayChordScalesToggle" />
            <span>Chord scales</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayChordNotesToggle" />
            <span>Chord notes</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayChordNotesSimplifiedToggle" />
            <span>Chord notes - Simplified</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayChordTonesToggle" />
            <span>Chord tones</span>
          </label>
          <label class="overlays-item" role="menuitemcheckbox">
            <input type="checkbox" id="overlayDiagramToggle" />
            <span>Diagram</span>
          </label>
        </div>
      </div>
    </div>
    <div id="instrumentsPanel" class="options-panel" hidden>
      <div class="drum-row">
        <span class="drum-label">Count-in</span>
        <div class="seg" id="countInSeg" role="tablist">
          <button type="button" data-count="0">Off</button>
          <button type="button" data-count="1" class="active">1 bar</button>
          <button type="button" data-count="2">2 bars</button>
        </div>
        <label class="wake-label">
          <input type="checkbox" id="loopCountInToggle" class="switch-input" />
          <span class="switch" aria-hidden="true"></span>
          <span>At Loop Start</span>
        </label>
      </div>
      <div class="drum-row">
        <span class="drum-label">Drums</span>
        <div class="seg" id="drumSeg" role="tablist">
          <button type="button" data-mode="ride" class="active">Real</button>
          <button type="button" data-mode="hat">2 & 4</button>
          <button type="button" data-mode="click">Click</button>
        </div>
        <input type="range" id="drumVol" class="drum-vol" min="0" max="100" value="40" aria-label="Drum volume" />
      </div>
      <div class="drum-row">
        <span class="drum-label">Piano</span>
        <label class="wake-label">
          <input type="checkbox" id="embellishToggle" class="switch-input" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Embellish Chords</span>
        </label>
        <input type="range" id="pianoVol" class="drum-vol" min="0" max="100" value="40" aria-label="Piano volume" />
      </div>
      <div class="drum-row">
        <span class="drum-label">Lead</span>
        <div class="lead-controls">
          <label class="wake-label">
            <input type="checkbox" id="playScoreToggle" class="switch-input" />
            <span class="switch" aria-hidden="true"></span>
            <span>Play</span>
          </label>
          <label class="wake-label play-head-label">
            <input type="checkbox" id="playHeadCheckbox" class="play-head-checkbox" disabled />
            <span>Head</span>
          </label>
        </div>
        <input type="range" id="leadVol" class="drum-vol" min="0" max="100" value="40" aria-label="Lead volume" />
      </div>
    </div>
  </header>

  <main>
    <div id="scoreTitle" class="score-title" aria-live="polite"></div>
    <div id="chart" class="chart"></div>
  </main>
  <div class="fingerboard-section">
    <div id="fingerboardPanel" class="fingerboard-panel" hidden>
      <div class="fb-left">
        <div class="fb-chord-line">
          <span class="fb-chord-name" id="fbChordName"></span>
          <span class="fb-chord-notes" id="fbChordNotes"></span>
        </div>
        <div class="fb-notes-measure" id="fbNotesMeasure"></div>
        <div class="fb-scale-name" id="fbScale"></div>
        <div class="fb-chord-nav" id="fbChordNav" hidden>
          <button type="button" id="fbChordPrev" class="fb-chord-nav-btn">Previous</button>
          <button type="button" id="fbChordNext" class="fb-chord-nav-btn">Next</button>
        </div>
      </div>
      <div class="fb-grid" id="fbGrid"></div>
    </div>
    <div id="gamePanel" class="game-panel kbd-hidden" hidden>
      <div class="game-keyboard game-keyboard-left" id="gameKeyboardLeft">
        <button type="button" class="game-key pos-0" data-pc="0">C</button>
        <button type="button" class="game-key pos-1" data-pc="5">F</button>
        <button type="button" class="game-key pos-2" data-pc="10">B♭ / A♯</button>
        <button type="button" class="game-key pos-3" data-pc="3">E♭ / D♯</button>
        <button type="button" class="game-key pos-4" data-pc="8">A♭ / G♯</button>
        <button type="button" class="game-key pos-5" data-pc="1">D♭ / C♯</button>
      </div>
      <div class="game-score">
        <select id="gameKindSelect" class="game-kind-select" aria-label="Game kind">
          <option value="follow">Follow</option>
          <option value="hidden" selected>Hidden</option>
        </select>
        <div class="game-score-counters">
          <span class="game-correct" id="gameCorrectCount" title="Correct notes">0</span>
          <span class="game-mistakes" id="gameMistakeCount" title="Mistakes">0</span>
        </div>
        <div class="game-detected" id="gameDetectedNote" title="Note detected from microphone">—</div>
        <div class="game-score-buttons">
          <button type="button" id="gameResetBtn" class="game-reset-btn" aria-label="Reset game">↺</button>
          <button type="button" id="gameMicBtn" class="game-mic-btn" aria-label="Listen via microphone" aria-pressed="false" title="Listen via microphone">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" ry="3"
                    stroke="currentColor" stroke-width="1.8" fill="none"/>
              <path d="M 5 11 C 5 15 8 18 12 18 C 16 18 19 15 19 11"
                    stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" id="gameMetronomeBtn" class="game-play-btn" aria-label="Play / Stop" aria-pressed="false" title="Play / Stop">
            <svg class="game-play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="8,5 8,19 19,12" fill="currentColor" stroke="none"/>
            </svg>
            <svg class="game-stop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" fill="currentColor" stroke="none" rx="1.5" ry="1.5"/>
            </svg>
          </button>
          <button type="button" id="gameKeyboardToggle" class="game-kbd-toggle" aria-label="Show / hide keyboard" aria-pressed="false" title="Show / hide keyboard">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="7" width="20" height="10" rx="1.5" ry="1.5"
                    stroke="currentColor" stroke-width="1.6" fill="none"/>
              <line x1="6"  y1="7" x2="6"  y2="13" stroke="currentColor" stroke-width="1.2"/>
              <line x1="10" y1="7" x2="10" y2="13" stroke="currentColor" stroke-width="1.2"/>
              <line x1="14" y1="7" x2="14" y2="13" stroke="currentColor" stroke-width="1.2"/>
              <line x1="18" y1="7" x2="18" y2="13" stroke="currentColor" stroke-width="1.2"/>
              <line x1="5"  y1="15" x2="19" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="game-keyboard game-keyboard-right" id="gameKeyboardRight">
        <button type="button" class="game-key pos-0" data-pc="7">G</button>
        <button type="button" class="game-key pos-1" data-pc="2">D</button>
        <button type="button" class="game-key pos-2" data-pc="9">A</button>
        <button type="button" class="game-key pos-3" data-pc="4">E</button>
        <button type="button" class="game-key pos-4" data-pc="11">B</button>
        <button type="button" class="game-key pos-5" data-pc="6">G♭ / F♯</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="status-bar">
      <div class="status" id="status">Ready</div>
      <span class="app-version" id="appVersion">v4.73</span>
    </div>
  </footer>
  </div><!-- /#mainArea -->
</div>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="app.js?v=578"></script>
<script>
  // Register the service worker so Chrome/Android will surface the
  // "Install app" / "Add to Home screen" prompt. Fails silently on
  // browsers that don't support SW or when served insecurely.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
