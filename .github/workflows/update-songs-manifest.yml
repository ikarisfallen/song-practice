# Auto-regenerates songs/manifest.json whenever a head file is added,
# renamed, or removed. The PWA on GitHub Pages reads this manifest to
# resolve case mismatches between iRealPro song titles ("You And The
# Night And The Music") and on-disk filenames ("You and the Night and
# the Music.musicxml"). Without it, Android (case-sensitive) can't
# find files that Windows (case-insensitive) loaded just fine.
#
# Loop avoidance:
#   - Trigger only fires when files DIRECTLY under `songs/` change.
#   - The commit message includes `[skip ci]` so this workflow doesn't
#     re-trigger itself when it pushes the regenerated manifest back.
name: Update songs manifest

on:
  push:
    branches: [main]
    paths:
      - 'songs/**'
      - 'licks/**'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Regenerate manifests
        run: |
          # Same logic for songs/ and licks/: list every .musicxml /
          # .mid file (any case), sort, and emit a JSON array.
          shopt -s nullglob nocaseglob
          for dir in songs licks; do
            if [ -d "$dir" ]; then
              ( cd "$dir"
                files=( *.musicxml *.mid )
                printf '%s\n' "${files[@]}" \
                  | sort \
                  | python3 -c "import sys, json; print(json.dumps(sorted([l.strip() for l in sys.stdin if l.strip()]), indent=2))" \
                  > manifest.json
                echo "$dir/manifest.json: $(python3 -c 'import json; print(len(json.load(open(\"manifest.json\"))))')"
              )
            fi
          done

      - name: Commit if changed
        run: |
          if git diff --quiet songs/manifest.json licks/manifest.json; then
            echo "manifests unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs/manifest.json licks/manifest.json
          git commit -m "Auto-update song/lick manifests [skip ci]"
          git push
